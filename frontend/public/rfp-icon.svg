<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110">
  <!-- Document shadow/base -->
  <polygon points="8,4 68,4 68,19 83,19 83,94 8,94"
           fill="#eaf0f6" stroke="#3d5a78" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Folded corner triangle -->
  <polygon points="68,4 83,19 68,19"
           fill="#bfd0e0" stroke="#3d5a78" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- RFP bold text -->
  <text x="16" y="36" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#2b3f5c" letter-spacing="1">RFP</text>

  <!-- Horizontal lines representing text -->
  <line x1="14" y1="47" x2="70" y2="47" stroke="#6a8aaa" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="14" y1="57" x2="70" y2="57" stroke="#6a8aaa" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="14" y1="67" x2="55" y2="67" stroke="#6a8aaa" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Red pen, diagonal, tip pointing to lower-left, overlapping bottom-right of document -->
  <!-- Pen sits at ~-45 degrees, top-right to bottom-left -->
  <!-- Using a group with transform to place and rotate -->
  <g transform="translate(80, 95) rotate(-45)">
    <!-- Cap at top -->
    <rect x="-5" y="-48" width="10" height="8" rx="2.5" fill="#aa2020"/>
    <!-- Barrel -->
    <rect x="-5" y="-40" width="10" height="36" rx="2" fill="#cc2828"/>
    <!-- Barrel highlight -->
    <rect x="-3.5" y="-40" width="2.5" height="36" rx="1" fill="#e05050" opacity="0.55"/>
    <!-- Ferrule (metal band) -->
    <rect x="-5" y="-6" width="10" height="5" rx="1" fill="#bbbbbb"/>
    <!-- Tip cone -->
    <polygon points="-5,0 5,0 0,12" fill="#e0c090"/>
    <!-- Tip lead -->
    <polygon points="-2,10 2,10 0,14" fill="#333"/>
  </g>
</svg>
